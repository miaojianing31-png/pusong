<!doctype html>
<html lang="zh-CN">
<head>

  <style>

    *{box-sizing:border-box}html{background:var(--paper);scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif;font-size:16px;line-height:1.7;text-wrap:pretty}a{color:inherit;text-decoration:none}button,input,select{font:inherit;color:inherit}a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--sky);outline-offset:3px}.shell{width:var(--page);margin-inline:auto}

    .hero{min-height:calc(100svh - 76px);display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line)}.visual{min-height:680px;background:#e7e7df;display:grid;place-items:center;position:relative;overflow:hidden}.visual:before{content:"";position:absolute;width:62%;aspect-ratio:1;border:1px solid rgba(16,43,58,.16);transform:rotate(45deg)}.visual:after{content:attr(data-index);position:absolute;left:34px;bottom:28px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}.visual img{position:relative;z-index:2;width:min(78%,680px);height:min(75vh,700px);object-fit:contain;mix-blend-mode:multiply;filter:drop-shadow(0 36px 40px rgba(16,43,58,.13));animation:arrive .7s var(--ease) both}
    .info{padding:clamp(64px,8vw,130px) clamp(38px,7vw,110px);display:flex;flex-direction:column;justify-content:center}.eyebrow{font-size:11px;letter-spacing:.17em;text-transform:uppercase;color:var(--blue);font-weight:750}.model{font-size:clamp(54px,6vw,96px);letter-spacing:-.06em;line-height:.9;margin:28px 0 24px;font-weight:820;color:var(--blue)}.info h1{font-size:clamp(34px,3.4vw,58px);line-height:1.12;letter-spacing:-.035em;margin:0 0 34px}.lead{font-size:clamp(17px,1.3vw,21px);line-height:1.85;color:var(--muted);max-width:700px;margin:0}.hero-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:40px}.btn{min-height:50px;border:1px solid var(--ink);display:inline-flex;align-items:center;justify-content:center;padding:0 22px;font-size:13px;font-weight:720;background:transparent;cursor:pointer;transition:.2s var(--ease)}.btn.primary{background:var(--ink);color:#fff}.btn:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(16,43,58,.12)}.btn:active{transform:none}
    .content{padding:clamp(90px,10vw,160px) 0}.overview{display:grid;grid-template-columns:.62fr 1.38fr;gap:10vw}.section-number{font-size:11px;letter-spacing:.17em;color:var(--blue);text-transform:uppercase;font-weight:750}.overview h2,.section-title{font-size:clamp(40px,5vw,72px);line-height:1.08;letter-spacing:-.045em;margin:0}.overview-copy{font-size:clamp(18px,1.7vw,26px);line-height:1.75;margin:0 0 58px}.specs{border-top:1px solid var(--line)}.spec-row{display:grid;grid-template-columns:160px 1fr;gap:32px;padding:18px 0;border-bottom:1px solid var(--line)}.spec-row span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.spec-row b{font-size:16px;font-weight:650}
    .two-col{display:grid;grid-template-columns:1fr 1fr;margin-top:clamp(100px,12vw,180px);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.list-block{padding:60px 8vw 70px 0}.list-block+.list-block{border-left:1px solid var(--line);padding-left:8vw;padding-right:0}.list-block h2{font-size:34px;letter-spacing:-.03em;margin:16px 0 38px}.item-list{list-style:none;margin:0;padding:0}.item-list li{padding:18px 0 18px 32px;border-top:1px solid var(--line);position:relative}.item-list li:before{content:"";width:8px;height:8px;background:var(--blue);position:absolute;left:0;top:27px;transform:rotate(45deg)}
    .calculator{margin-top:clamp(100px,12vw,180px);background:var(--ink);color:#fff;display:none;grid-template-columns:.85fr 1.15fr}.calculator.visible{display:grid}.calc-intro{padding:70px}.calc-intro .section-number{color:#8bc0df}.calc-intro h2{font-size:clamp(38px,4.5vw,62px);line-height:1.12;margin:18px 0}.calc-intro p{color:rgba(255,255,255,.65);max-width:520px}.calc-form{background:#fff;color:var(--ink);padding:70px;display:grid;align-content:center}.fields{display:grid;grid-template-columns:1fr 1fr;gap:18px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:8px}.field input,.field select{height:52px;width:100%;background:var(--paper);border:1px solid var(--line);padding:0 15px}.calc-result{margin-top:20px;background:var(--soft);display:none;grid-template-columns:1fr auto 1fr;align-items:center;text-align:center;padding:24px}.calc-result.visible{display:grid}.amount span{display:block;font-size:12px;color:var(--muted)}.amount b{font-size:34px;color:var(--blue)}.plus{font-size:24px;color:var(--muted)}
    .advice{margin-top:clamp(90px,10vw,150px);display:grid;grid-template-columns:1.1fr .9fr;gap:8vw;align-items:end}.advice h2{font-size:clamp(42px,5vw,78px);line-height:1.04;letter-spacing:-.05em;margin:16px 0 0}.advice-side p{color:var(--muted);margin:0 0 24px}.advice-note{border-top:1px solid var(--line);padding-top:18px;font-size:12px;color:var(--muted)}
    .product-nav{margin-top:clamp(100px,12vw,170px);display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.product-nav a{min-height:190px;padding:30px;display:flex;flex-direction:column;justify-content:flex-end;transition:background .2s}.product-nav a:hover{background:#fff}.product-nav a+ a{border-left:1px solid var(--line);text-align:right}.product-nav span{font-size:11px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}.product-nav b{font-size:22px;margin-top:12px}
    footer{background:var(--blue);color:#fff;padding:70px 0 28px}.footer-grid{display:grid;grid-template-columns:.8fr 1.2fr;gap:60px}.footer-title{font-size:clamp(34px,4vw,60px);line-height:1.12;font-weight:750}.footer-info{display:grid;grid-template-columns:1fr 154px;gap:30px;align-items:end}.footer-contact{display:grid;gap:8px}.footer-contact a{font-size:17px}.footer-contact a:hover{color:#d7edf8}.footer-qr{background:#fff;color:var(--ink);padding:8px}.footer-qr img{display:block;width:100%;height:auto}.footer-qr span{display:block;font-size:10px;padding:5px 2px 0}.copyright{margin-top:70px;padding-top:24px;border-top:1px solid rgba(255,255,255,.25);display:flex;justify-content:space-between;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.6)}
    .empty{min-height:calc(100svh - 76px);display:grid;place-items:center;padding:40px}.empty-card{text-align:center;max-width:600px}.empty-card h1{font-size:50px;margin:0 0 18px}.empty-card p{color:var(--muted)}
    .mobile-dock{display:none}
    @keyframes arrive{from{opacity:0;transform:translateY(28px) scale(.98)}to{opacity:1;transform:none}}
    @media(max-width:950px){:root{--page:min(100% - 40px,840px)}.hero{grid-template-columns:1fr}.visual{min-height:560px}.info{padding:70px 40px}.overview{grid-template-columns:1fr;gap:40px}.two-col{grid-template-columns:1fr}.list-block{padding:50px 0}.list-block+.list-block{border-left:0;border-top:1px solid var(--line);padding:50px 0}.calculator{grid-template-columns:1fr}.advice{grid-template-columns:1fr}.footer-grid{grid-template-columns:1fr}}
    @media(max-width:620px){:root{--page:calc(100% - 32px)}body{padding-bottom:calc(66px + env(safe-area-inset-bottom))}.header{height:68px;position:sticky;top:0}.nav{grid-template-columns:1fr 1fr}.brand{display:none}.back{min-height:44px;display:flex;align-items:center}.hotline{min-height:44px;display:flex;align-items:center;justify-content:flex-end}.hotline b{display:block;margin:0}.hero{min-height:0}.visual{min-height:360px;height:48svh;max-height:470px}.visual:before{width:70%}.visual:after{left:16px;bottom:12px;font-size:9px}.visual img{height:88%;width:88%;filter:drop-shadow(0 20px 24px rgba(16,43,58,.12))}.info{padding:44px 20px 54px}.model{font-size:clamp(48px,15vw,64px);margin:18px 0 16px}.info h1{font-size:34px;margin-bottom:22px}.lead{font-size:16px;line-height:1.75}.hero-actions{display:grid;grid-template-columns:1fr 1fr;margin-top:28px}.btn{min-height:48px;padding:0 12px}.content{padding:74px 0}.overview{gap:28px}.overview h2,.section-title{font-size:38px}.overview-copy{font-size:18px;margin-bottom:36px}.spec-row{grid-template-columns:1fr;gap:4px;padding:16px 0}.two-col{margin-top:76px}.list-block{padding:42px 0}.list-block h2{font-size:29px;margin-bottom:28px}.item-list li{padding:16px 0 16px 28px}.calculator{margin:76px -16px 0}.calc-intro,.calc-form{padding:38px 24px}.calc-intro h2{font-size:38px}.fields{grid-template-columns:1fr}.calc-result{grid-template-columns:1fr;gap:8px}.plus{font-size:18px}.advice{margin-top:76px}.advice h2{font-size:40px}.product-nav{grid-template-columns:1fr;margin-top:76px}.product-nav a{min-height:150px;padding:24px 0}.product-nav a+ a{border-left:0;border-top:1px solid var(--line);text-align:left}.product-nav b{font-size:19px}.footer-grid{grid-template-columns:1fr}.footer-info{grid-template-columns:1fr}.footer-qr{width:160px}.copyright{display:block;margin-top:52px}.copyright span{display:block;margin-top:8px}.mobile-dock{position:fixed;z-index:60;display:grid;grid-template-columns:1fr 1fr;left:0;right:0;bottom:0;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:rgba(243,244,240,.96);backdrop-filter:blur(14px);border-top:1px solid var(--line);gap:8px}.mobile-dock a{min-height:48px;display:flex;align-items:center;justify-content:center;border:1px solid var(--ink);font-size:13px;font-weight:750}.mobile-dock a:last-child{background:var(--ink);color:#fff}}
    @media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important;scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <header class="header">
    <div class="shell nav"><a class="back" href="index.html#products">返回产品目录</a><a class="brand" href="index.html">唐山甫松商贸<small>Fusong Commerce</small></a><a class="hotline" href="tel:4008506001">服务热线 <b>4008-506-001</b></a></div>
  </header>
  <main id="page"></main>
  <nav class="mobile-dock" aria-label="手机快捷联系"><a href="index.html#products">产品目录</a><a href="tel:18531592585">咨询选型</a></nav>
  <script src="assets/js/products.js"></script>
  <script>
    const products=window.FUSONG_PRODUCTS;
    const params=new URLSearchParams(window.location.search);
    const id=params.get("id");
    const product=products.find(item=>item.id===id);
    const page=document.getElementById("page");
    function list(items){return items.map(item=>`<li>${item}</li>`).join("")}
    function specs(items){return items.map(item=>`<div class="spec-row"><span>${item[0]}</span><b>${item[1]}</b></div>`).join("")}
    function renderEmpty(){document.title="未找到产品｜唐山甫松商贸";page.innerHTML=`<section class="empty"><div class="empty-card"><div class="section-number">Product not found</div><h1>没有找到这款产品</h1><p>链接可能不完整，或产品编号已经更改。请返回目录重新选择。</p><a class="btn primary" href="index.html#products">返回产品目录</a></div></section>`}
    function renderProduct(p){
      const index=products.indexOf(p),prev=products[(index-1+products.length)%products.length],next=products[(index+1)%products.length];
      document.title=`${p.brand} ${p.model} ${p.name}｜唐山甫松商贸`;
      document.querySelector('meta[name="description"]').content=p.short;
      page.innerHTML=`
        <section class="hero">
          <div class="visual" data-index="Product ${String(index+1).padStart(2,"0")} / ${String(products.length).padStart(2,"0")}"><img src="assets/optimized/products/${p.id}-640.webp" srcset="assets/optimized/products/${p.id}-640.webp 640w, assets/optimized/products/${p.id}-1200.webp 1200w" sizes="(max-width:620px) 88vw, (max-width:950px) 78vw, 46vw" width="640" height="640" decoding="async" fetchpriority="high" onerror="this.onerror=null;this.removeAttribute('srcset');this.src='${p.image}'" alt="${p.brand} ${p.model} ${p.name}"></div>
          <div class="info"><div class="eyebrow">${p.brand} · ${p.category}</div><div class="model">${p.model}</div><h1>${p.name}</h1><p class="lead">${p.short}</p><div class="hero-actions"><a class="btn primary" href="tel:18531592585">咨询产品选型</a><a class="btn" href="#details">查看详细介绍</a></div></div>
        </section>
        <section class="content shell" id="details">
          <div class="overview"><div class="section-number">01 / Product overview</div><div><h2 style="margin-bottom:42px">针对具体问题，<br>给出明确用途。</h2><p class="overview-copy">${p.description}</p><div class="specs">${specs(p.specs)}</div></div></div>
          <div class="two-col"><div class="list-block"><div class="section-number">02 / Applications</div><h2>典型应用场景</h2><ul class="item-list">${list(p.applications)}</ul></div><div class="list-block"><div class="section-number">03 / Why it fits</div><h2>产品作用重点</h2><ul class="item-list">${list(p.benefits)}</ul></div></div>
          <section class="calculator ${p.mixRatios?"visible":""}" id="calculator">
            <div class="calc-intro"><div class="section-number">04 / Mixing calculator</div><h2>配比用量<br>快速计算</h2><p>输入本次需要的总胶量，系统按所选 A:B 重量比计算主剂与硬化剂的称重克数。</p></div>
            <div class="calc-form"><div class="fields"><div class="field"><label for="ratio">选择混合比率 A:B</label><select id="ratio">${(p.mixRatios||[]).map(r=>`<option value="${r}">${r} : 1</option>`).join("")}</select></div><div class="field"><label for="totalWeight">目标总重量（克）</label><input id="totalWeight" type="number" min="1" inputmode="decimal" placeholder="例如：50"></div></div><div class="calc-result" id="calcResult"><div class="amount"><span>主剂 A</span><b id="weightA">0.0 g</b></div><div class="plus">+</div><div class="amount"><span>硬化剂 B</span><b id="weightB">0.0 g</b></div></div></div>
          </section>
          <section class="advice"><div><div class="section-number">${p.mixRatios?"05":"04"} / Selection advice</div><h2>施工前，先把工况说清楚。</h2></div><div class="advice-side"><p>建议提供设备材质、工作温度、接触介质、缺陷尺寸及预期停机时间，以便更准确地进行产品选型。</p><a class="btn primary" href="tel:18531592585">联系选型顾问</a><p class="advice-note">页面仅整理用户提供资料中已确认的信息。具体施工配比、固化时间及技术指标请以实物标签或订货确认资料为准。</p></div></section>
          <nav class="product-nav" aria-label="前后产品"><a href="product.html?id=${prev.id}"><span>← 上一款 · ${prev.brand}</span><b>${prev.model} ${prev.name}</b></a><a href="product.html?id=${next.id}"><span>下一款 · ${next.brand} →</span><b>${next.model} ${next.name}</b></a></nav>
        </section>
        <footer><div class="shell"><div class="footer-grid"><div class="footer-title">粘接密封，<br>就选甫松。</div><div class="footer-info"><div class="footer-contact"><a href="tel:4008506001">服务热线 4008-506-001</a><a href="tel:18633965319">联系电话 18633965319</a><a href="tel:18531592585">联系电话 18531592585</a><a href="tel:13001813574">联系电话 13001813574</a><a href="mailto:295024779@qq.com">295024779@qq.com</a><span>河北省唐山市路南区花园里</span></div><div class="footer-qr"><img src="assets/fusong-brand/contact/wechat-glue.jpg" width="888" height="1118" loading="lazy" decoding="async" alt="微信 Glue 二维码"><span>扫码添加微信 Glue</span></div></div></div><div class="copyright"><span>© 2026 Tangshan Fusong Trading Co., Ltd</span><span>${p.brand} ${p.model}</span></div></div></footer>`;
      bindInteractions(p);
    }
    function bindInteractions(p){
      document.querySelectorAll('a[href^="#"]').forEach(a=>a.addEventListener("click",e=>{const target=document.querySelector(a.getAttribute("href"));if(target){e.preventDefault();window.scrollTo({top:target.offsetTop-40,behavior:"smooth"})}}));
      if(!p.mixRatios)return;
      const ratio=document.getElementById("ratio"),total=document.getElementById("totalWeight"),result=document.getElementById("calcResult");
      function calculate(){const sum=Number(total.value),a=Number(ratio.value);if(!Number.isFinite(sum)||sum<=0){result.classList.remove("visible");return}document.getElementById("weightA").textContent=(sum*a/(a+1)).toFixed(1)+" g";document.getElementById("weightB").textContent=(sum/(a+1)).toFixed(1)+" g";result.classList.add("visible")}
      ratio.addEventListener("change",calculate);total.addEventListener("input",calculate);
    }
    product?renderProduct(product):renderEmpty();
  </script>
</body>
</html>
